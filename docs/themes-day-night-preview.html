<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宠物机 · 6 套主题 日间/夜间(单件逐件摆位 · 奶油标准)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#efe7ef;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;color:#5a5460;padding:28px 18px 60px}
  h1{font-size:18px;font-weight:700;text-align:center;margin:0 0 4px}
  .sub{text-align:center;font-size:12px;color:#9a93a3;margin:0 0 26px;line-height:1.7}
  .theme-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 auto 30px;max-width:880px}
  .theme-name{font-size:14px;font-weight:700;letter-spacing:1px;align-self:flex-start;margin-left:6%;color:#6c6478}
  .theme-name .en{font-weight:400;font-size:11px;color:#b0a8ba;margin-left:8px;letter-spacing:0}
  .pair{display:flex;gap:34px;flex-wrap:wrap;justify-content:center;width:100%}

  .device{position:relative;width:344px;height:344px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.10))}
  .screen{position:absolute;left:19.6%;top:22.8%;width:60.7%;height:48.7%;overflow:hidden;background:#fff}
  .room{position:absolute;inset:0;overflow:hidden}
  .room img{position:absolute;image-rendering:pixelated}
  .bg{left:0;top:0;width:100%;height:100%;object-fit:cover}      /* cover 填满 + 裁掉多余(默认居中,可逐套调垂直锚点) */
  .ov{position:absolute;inset:0;background:rgba(40,48,92,.34)}    /* 均匀夜间滤镜 */
  .glow{position:absolute;inset:0}                               /* 光源处暖光 */
  .shell{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cap{position:absolute;bottom:-24px;left:0;right:0;text-align:center;font-size:12px;color:#8c8598}
</style></head><body>
  <h1>电子宠物机 · 6 套主题 · 日间 / 夜间</h1>
  <p class="sub">每件家具用单件 PNG 逐件摆位(不复用成图);夜间统一套奶油标准:夜空窗 + 均匀压暗 + 光源处暖光 + 灯/宠物常亮</p>
  <div id="stage"></div>

<script>
const ROOT = '../pet-machine-assets';
const SHELL = ROOT + '/shells/shell_square.png';
const PET   = ROOT + '/pets/pet_cat.png';

// 每件 = [name, left, top, w](相对屏幕的比例;name=furn_window 自动日/夜)。按顺序叠,后者在上。
// lamp = 夜间重绘在滤镜之上的「光源」件(保持亮);glow = 暖光中心;pet = [w, cx, bottom]
const LAYOUTS = {
  'cream-bedroom': { zh:'奶油卧室', en:'cream bedroom', bgy:.80,
    items:[['furn_window',.05,.09,.27],['furn_picture',.44,.11,.12],['furn_shelf',.63,.10,.33],
           ['furn_plant',.04,.49,.18],['furn_rug',.17,.71,.38],['furn_bed',.60,.39,.36],
           ['furn_lamp_off',.19,.52,.15]],
    lamp:['furn_lamp_on',.19,.52,.15], glow:[.26,.60], pet:[.32,.50,.19] },

  'forest-cabin': { zh:'森林木屋', en:'forest cabin',
    items:[['furn_window',.05,.11,.28],['furn_log_shelf',.64,.14,.30],['furn_hanging_lamp',.50,.05,.12],
           ['furn_plant',.02,.55,.16],['furn_table',.40,.50,.27],['furn_chair',.66,.49,.20],
           ['furn_mushroom_stool',.84,.60,.17]],
    lamp:['furn_hanging_lamp',.50,.05,.12], glow:[.54,.52], pet:[.32,.31,.12] },

  'seaside': { zh:'海边小屋', en:'seaside',
    items:[['furn_window',.04,.11,.29],['furn_shell_shelf',.66,.14,.30],['furn_shell',.71,.20,.09],
           ['furn_swim_ring',.02,.64,.18],['furn_surfboard',.82,.56,.26],['furn_umbrella',.44,.40,.28],
           ['furn_beach_chair',.64,.50,.26]],
    lamp:null, glow:[.15,.22], pet:[.32,.30,.10] },

  'sakura-room': { zh:'樱花和室', en:'sakura room',
    items:[['furn_window',.05,.11,.29],['furn_hanging_scroll',.75,.12,.12],
           ['furn_bonsai',.02,.52,.16],['furn_cushion',.17,.64,.22],
           ['furn_low_table',.35,.56,.30],['furn_vase',.43,.46,.10],
           ['furn_paper_lantern',.82,.64,.16]],
    lamp:['furn_paper_lantern',.82,.64,.16], glow:[.90,.70], pet:[.32,.70,.10] },

  'starry-room': { zh:'星空小屋', en:'starry room',
    items:[['furn_window',.04,.11,.28],['furn_moon_wall',.40,.08,.16],['furn_planet_shelf',.66,.12,.30],
           ['furn_planet_rug',.34,.66,.30],['furn_cloud_cushion',.03,.62,.20],['furn_star_lamp',.24,.42,.15],
           ['furn_rocket_bed',.64,.40,.30]],
    lamp:['furn_star_lamp',.24,.42,.15], glow:[.32,.56], pet:[.32,.48,.12] },

  'sweets-shop': { zh:'甜品店', en:'sweets shop',
    items:[['furn_window',.04,.11,.28],['furn_hanging_sign',.42,.06,.14],['furn_dessert_rack',.70,.12,.26],
           ['furn_milk_tea',.07,.58,.12],['furn_cupcake_stand',.28,.54,.20],['furn_high_stool',.49,.56,.14],
           ['furn_cake_cabinet',.64,.40,.30]],
    lamp:['furn_cake_cabinet',.64,.40,.30], glow:[.78,.58], pet:[.32,.30,.10] },
};
const ORDER = ['cream-bedroom','forest-cabin','seaside','sakura-room','starry-room','sweets-shop'];

const pc = n => (n*100).toFixed(2)+'%';
function piece(key, name, l, t, w, night, cls){
  const file = name === 'furn_window' ? (night ? 'furn_window_night' : 'furn_window_day') : name;
  return `<img class="${cls||''}" src="${ROOT}/themes/${key}/${file}.png" style="left:${pc(l)};top:${pc(t)};width:${pc(w)}">`;
}
function petImg(w, cx, bottom){
  return `<img class="pet" src="${PET}" style="left:${pc(cx - w/2)};bottom:${pc(bottom)};width:${pc(w)};z-index:7">`;
}
function device(key, night){
  const L = LAYOUTS[key];
  let html = `<img class="bg" src="${ROOT}/themes/${key}/bg.png" style="object-position:50% ${Math.round((L.bgy??0.5)*100)}%">`;
  for (const [name,l,t,w] of L.items) html += piece(key,name,l,t,w,night);
  if (night){
    html += `<div class="ov"></div>`;
    if (L.glow) html += `<div class="glow" style="background:radial-gradient(circle at ${pc(L.glow[0])} ${pc(L.glow[1])}, rgba(255,226,165,.55), rgba(255,226,165,0) 40%)"></div>`;
    if (L.lamp){ const [n,l,t,w]=L.lamp; html += piece(key,n,l,t,w,night,'lit'); }
  }
  html += petImg(...L.pet);
  return `<div class="device"><div class="screen"><div class="room">${html}</div></div>`
       + `<img class="shell" src="${SHELL}"><div class="cap">${night?'\u{1F319} 夜间':'☀️ 日间'}</div></div>`;
}
document.getElementById('stage').innerHTML = ORDER.map(k => {
  const L = LAYOUTS[k];
  return `<div class="theme-row"><div class="theme-name">${L.zh}<span class="en">${L.en}</span></div>
    <div class="pair">${device(k,false)}${device(k,true)}</div></div>`;
}).join('');
</script>
</body></html>
